[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dummy-motion"
version = "0.3.0"
description = "Offline seven-axis Cartesian planning for Dummy robot"
readme = "dummy_motion/README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2"]

[tool.setuptools]
packages = ["dummy_motion"]
