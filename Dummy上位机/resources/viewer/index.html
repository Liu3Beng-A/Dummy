<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dummy · 本地 URDF 视图</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="importmap">
  {"imports": {
    "three": "./vendor/three/three.module.js",
    "three/examples/jsm/loaders/STLLoader.js": "./vendor/three/loaders/STLLoader.js",
    "three/examples/jsm/loaders/ColladaLoader.js": "./vendor/three/loaders/ColladaLoader.js"
  }}
  </script>
</head>
<body>
  <div id="canvas"></div>
  <div class="viewer-info">
    <div class="topline" role="status" aria-live="polite">
      <div class="badge muted" id="telemetry">尚无位置回读</div>
    </div>
    <div class="legend">
      <span id="solid-label" hidden><i class="silver"></i><span>实际回读 · 实体</span></span>
      <span id="ghost-label"><i class="ghost"></i>目标位置 · 虚体</span>
      <span id="marker-label" hidden><i class="orange"></i>MoveL 目标标记</span>
    </div>
  </div>
  <div id="error" class="error" role="alert">正在加载模型与本地网格…</div>
  <div class="footer">
    <span>左键旋转 · 右键平移 · 滚轮缩放</span>
    <span id="gripper-status">夹爪：目标开度</span>
  </div>
  <div class="model-status" id="model-status">正在加载本地 URDF…</div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    window.robotBridge = null;
    window.pendingRobotState = null;
    window.pendingRgbFrame = null;
    window.pendingTelemetryMetrics = null;
    window.pendingViewerPresentation = 'active';
    window.receiveViewerPresentation = mode => {
      if (!['active', 'background', 'hidden'].includes(mode)) return;
      window.pendingViewerPresentation = mode;
      window.robotViewer?.setPresentation(mode);
    };
    window.receiveRobotRgbPayload = payload => {
      const legacy = Array.isArray(payload);
      if (!legacy && (payload === null || typeof payload !== 'object'
        || (payload.light_on !== undefined && typeof payload.light_on !== 'boolean'))) return false;
      const effectMode = legacy ? null : (payload.effect_mode ?? null);
      if (effectMode !== null && (!Number.isInteger(effectMode) || effectMode < 0 || effectMode > 16)) return false;
      const frame = legacy ? payload : payload.colors;
      if (!Array.isArray(frame) || frame.length !== 24) return false;
      for (const color of frame) {
        if (!Array.isArray(color) || color.length !== 3) return false;
        for (const value of color) {
          if (!Number.isInteger(value) || value < 0 || value > 255) return false;
        }
      }
      const lightOn = legacy ? undefined : payload.light_on;
      if (window.robotViewer && !window.robotViewer.setRgbFrame(frame, lightOn, effectMode)) return false;
      const colors = frame.map(color => color.slice());
      window.pendingRgbFrame = legacy ? colors : { colors, light_on: lightOn, effect_mode: effectMode };
      return true;
    };
    if (window.qt && window.QWebChannel) {
      new QWebChannel(qt.webChannelTransport, channel => {
        window.robotBridge = channel.objects.robotBridge;
        window.robotBridge.state_changed.connect(json => {
          const state = JSON.parse(json);
          window.pendingRobotState = state;
          if (window.robotViewer) window.robotViewer.setState(state);
        });
        window.robotBridge.rgb_changed.connect(json => {
          let payload;
          try { payload = JSON.parse(json); } catch { return; }
          window.receiveRobotRgbPayload(payload);
        });
        window.robotBridge.telemetry_changed.connect(json => {
          try { window.pendingTelemetryMetrics = JSON.parse(json); } catch { /* Retain last valid stats. */ }
        });
        window.robotBridge.presentation_changed.connect(window.receiveViewerPresentation);
        window.robotBridge.model_status_changed.connect(text => {
          const label = document.getElementById('model-status');
          label.textContent = text;
          label.title = text;
        });
        if (window.robotViewer?.loaded) {
          window.robotBridge.viewerReady();
          window.robotViewer.reportDiagnostics?.();
        }
        if (window.robotViewerError) window.robotBridge.viewerError(window.robotViewerError);
      });
    }
    window.reportRobotError = message => {
      const text = String(message);
      window.robotViewerError = text;
      document.getElementById('error').hidden = false;
      document.getElementById('error').textContent = '三维加载失败：' + text;
      window.robotBridge?.viewerError(text);
    };
    window.addEventListener('error', event => window.reportRobotError(event.message));
    window.addEventListener('unhandledrejection', event => window.reportRobotError(event.reason));
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
